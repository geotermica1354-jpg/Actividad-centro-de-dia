<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Quién lo dijo? Completa el refrán</title>
<style>
:root{--bg:#fdf6e3;--fg:#2b2b2b;--card:#fff;--accent:#b5451b;--ok:#2e7d32;--line:#e0d3b0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a14;--fg:#f4ecd8;--card:#2a261d;--accent:#ff9b6b;--ok:#8fd694;--line:#4a4333}}
:root[data-theme="dark"]{--bg:#1d1a14;--fg:#f4ecd8;--card:#2a261d;--accent:#ff9b6b;--ok:#8fd694;--line:#4a4333}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:clamp(1.6rem,4vw,2.6rem);margin:8px 0 0;color:var(--accent);text-align:center}
.sub{font-size:clamp(1.1rem,2.5vw,1.6rem);margin:4px 0 12px;text-align:center}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;width:100%;max-width:1000px;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center;gap:20px}
.n{font-size:clamp(1rem,2vw,1.4rem);opacity:.7}
.start{font-size:clamp(2rem,6vw,4.2rem);font-weight:bold;line-height:1.25}
.end{font-size:clamp(2rem,6vw,4.2rem);font-weight:bold;line-height:1.25;color:var(--ok);min-height:1.3em;visibility:hidden}
.end.show{visibility:visible}
.bar{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center;width:100%;max-width:1000px}
button{font:inherit;font-size:clamp(1.2rem,3vw,1.9rem);padding:14px 26px;border-radius:14px;border:3px solid var(--accent);background:var(--card);color:var(--fg);cursor:pointer;flex:1;min-width:140px}
button.main{background:var(--accent);color:var(--bg);font-weight:bold;flex:2}
button:focus-visible{outline:4px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<h1>¿Quién lo dijo?</h1>
<p class="sub">Completa el refrán</p>
<main class="card" aria-live="polite">
  <div class="n" id="n"></div>
  <div class="start" id="s"></div>
  <div class="end" id="e"></div>
</main>
<div class="bar">
  <button id="prev">← Anterior</button>
  <button id="show" class="main">Ver respuesta</button>
  <button id="next">Siguiente →</button>
</div>
<script>
var R=[
["Más vale pájaro en mano…","…que ciento volando."],
["A caballo regalado…","…no le mires el diente."],
["Al mal tiempo…","…buena cara."],
["Camarón que se duerme…","…se lo lleva la corriente."],
["Dime con quién andas…","…y te diré quién eres."],
["En casa del herrero…","…cuchillo de palo."],
["No por mucho madrugar…","…amanece más temprano."],
["El que mucho abarca…","…poco aprieta."],
["A quien madruga…","…Dios le ayuda."],
["Ojos que no ven…","…corazón que no siente."],
["Cuando el río suena…","…agua lleva."],
["Perro ladrador…","…poco mordedor."],
["Más sabe el diablo por viejo…","…que por diablo."],
["Quien bien te quiere…","…te hará llorar."],
["De tal palo…","…tal astilla."],
["Agua que no has de beber…","…déjala correr."],
["Cree el ladrón…","…que todos son de su condición."],
["Zapatero…","…a tus zapatos."],
["Una golondrina no hace…","…verano."],
["A buen entendedor…","…pocas palabras bastan."]
];
var i=0,shown=false;
var n=document.getElementById("n"),s=document.getElementById("s"),e=document.getElementById("e"),b=document.getElementById("show");
function draw(){
  n.textContent="Refrán "+(i+1)+" de "+R.length;
  s.textContent=R[i][0];e.textContent=R[i][1];
  e.className="end"+(shown?" show":"");
  b.textContent=shown?"Ocultar respuesta":"Ver respuesta";
}
function go(d){i=(i+d+R.length)%R.length;shown=false;draw();}
function tog(){shown=!shown;draw();}
document.getElementById("prev").onclick=function(){go(-1)};
document.getElementById("next").onclick=function(){go(1)};
b.onclick=tog;
document.addEventListener("keydown",function(ev){
  if(ev.key==="ArrowRight")go(1);
  else if(ev.key==="ArrowLeft")go(-1);
  else if(ev.key===" "||ev.key==="Enter"){if(document.activeElement.tagName!=="BUTTON"){ev.preventDefault();tog();}}
});
draw();
</script>
</body>
</html>
